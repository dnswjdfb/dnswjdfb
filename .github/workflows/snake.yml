jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # 1. 권한 오류(code 128) 해결을 위해 쓰기 권한 추가
    permissions:
      contents: write 
      
    steps:
      # ... (기존 checkout 및 빌드 관련 코드 유지) ...

      - name: Deploy to GitHub Pages
        # 2. Node.js 경고 해결을 위해 v3.1.0을 v4로 변경
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: public # 실제 프로젝트의 빌드 폴더명으로 지정 (예: build, dist)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
