name: Generate Man Utd Snake Animation

on:
  schedule: # 12시간마다 자동 실행
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          # github user name
          github_user_name: ${{ github.repository_owner }}
          # 생성될 svg 파일 경로 및 색상 커스텀
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#DA291C&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#DA291C

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
